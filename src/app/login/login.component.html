<div class="login-container">
  <div class="login-card-wrapper">
    <mat-card class="login-card">
      <mat-card-header>
        <div class="header-content">
          <mat-icon class="logo-icon">login</mat-icon>
          <h1>Welcome Back</h1>
          <p class="subtitle">Sign in to continue to your account</p>
        </div>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="form-fields">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <mat-icon matIconPrefix>email</mat-icon>
              <input 
                matInput 
                type="email" 
                formControlName="email" 
                autocomplete="email">
              <mat-error *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                {{ getErrorMessage('email') }}
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Password</mat-label>
              <mat-icon matIconPrefix>lock</mat-icon>
              <input 
                matInput 
                [type]="hidePassword ? 'password' : 'text'" 
                formControlName="password"
                autocomplete="current-password">
              <button 
                mat-icon-button 
                matIconSuffix 
                type="button"
                (click)="hidePassword = !hidePassword"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hidePassword">
                <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                {{ getErrorMessage('password') }}
              </mat-error>
            </mat-form-field>
          </div>

          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            class="submit-button"
            [disabled]="loading">
            <span *ngIf="!loading">Login</span>
            <span *ngIf="loading">Logging in...</span>
          </button>
        </form>

        <div class="signup-link">
          <span>Don't have an account?</span>
          <a routerLink="/signup" mat-button color="primary">Sign up here</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
