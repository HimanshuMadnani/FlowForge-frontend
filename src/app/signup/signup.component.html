<div class="signup-container">
  <div class="signup-card-wrapper">
    <mat-card class="signup-card">
      <mat-card-header>
        <div class="header-content">
          <mat-icon class="logo-icon">account_circle</mat-icon>
          <h1>Create Account</h1>
          <p class="subtitle">Join us today and get started</p>
        </div>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
          <div class="form-fields">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Full Name</mat-label>
              <mat-icon matIconPrefix>person</mat-icon>
              <input 
                matInput 
                formControlName="name" 
                autocomplete="name">
              <mat-error *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid">
                {{ getErrorMessage('name') }}
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <mat-icon matIconPrefix>email</mat-icon>
              <input 
                matInput 
                type="email" 
                formControlName="email" 
                autocomplete="email">
              <mat-error *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
                {{ getErrorMessage('email') }}
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Contact Number</mat-label>
              <mat-icon matIconPrefix>phone</mat-icon>
              <input 
                matInput 
                formControlName="contactNumber" 
                autocomplete="tel">
              <mat-error *ngIf="signupForm.get('contactNumber')?.touched && signupForm.get('contactNumber')?.invalid">
                {{ getErrorMessage('contactNumber') }}
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Password</mat-label>
              <mat-icon matIconPrefix>lock</mat-icon>
              <input 
                matInput 
                [type]="hidePassword ? 'password' : 'text'" 
                formControlName="password"
                autocomplete="new-password">
              <button 
                mat-icon-button 
                matIconSuffix 
                type="button"
                (click)="hidePassword = !hidePassword"
                [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hidePassword">
                <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
              <mat-error *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
                {{ getErrorMessage('password') }}
              </mat-error>
            </mat-form-field>
          </div>

          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            class="submit-button"
            [disabled]="loading">
            <span *ngIf="!loading">Sign Up</span>
            <span *ngIf="loading">Creating Account...</span>
          </button>
        </form>

        <div class="login-link">
          <span>Already have an account?</span>
          <a routerLink="/login" mat-button color="primary">Login here</a>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
