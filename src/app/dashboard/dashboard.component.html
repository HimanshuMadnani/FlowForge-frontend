<div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" [class.collapsed]="!sidenavOpened">
        <div class="sidebar-header">
            <div class="logo">
                <mat-icon class="logo-icon">bolt</mat-icon>
                <span class="logo-text" *ngIf="sidenavOpened">FlowForge</span>
            </div>
            <button mat-icon-button class="toggle-btn" (click)="toggleSidenav()">
                <mat-icon>{{ sidenavOpened ? 'chevron_left' : 'chevron_right' }}</mat-icon>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }" class="nav-item"
                [matTooltip]="!sidenavOpened ? item.label : ''" matTooltipPosition="right">
                <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
                <span class="nav-label" *ngIf="sidenavOpened">{{ item.label }}</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <mat-divider></mat-divider>
            <button mat-button class="logout-btn" (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span *ngIf="sidenavOpened">Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="main-header">
            <div class="header-left">
                <button mat-icon-button class="mobile-menu-btn" (click)="toggleSidenav()">
                    <mat-icon>menu</mat-icon>
                </button>
                <h1 class="page-title">FlowForge</h1>
            </div>
            <div class="header-right">
                <button mat-icon-button [matMenuTriggerFor]="userMenu">
                    <mat-icon>account_circle</mat-icon>
                </button>
                <mat-menu #userMenu="matMenu">
                    <button mat-menu-item (click)="logout()">
                        <mat-icon>logout</mat-icon>
                        <span>Logout</span>
                    </button>
                </mat-menu>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
